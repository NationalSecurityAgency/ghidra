apply from: "$rootProject.projectDir/gradle/distributableGhidraExtension.gradle"
apply from: "$rootProject.projectDir/gradle/javaProject.gradle"
apply from: "$rootProject.projectDir/gradle/javaTestProject.gradle"
apply plugin: 'eclipse'
eclipse.project.name = 'Xtra AIAssistant'

dependencies {
	api project(':Base')
	api project(':Decompiler')
	api "com.anthropic:anthropic-java:2.34.0"

	// Ghidra only packages direct dependencies into an extension's lib directory, so the
	// SDK's transitive runtime dependencies are listed explicitly.
	runtimeOnly "com.anthropic:anthropic-java-client-okhttp:2.34.0"
	runtimeOnly "com.anthropic:anthropic-java-core:2.34.0"
	runtimeOnly "com.fasterxml.jackson.core:jackson-annotations:2.18.2"
	runtimeOnly "com.fasterxml.jackson.core:jackson-core:2.18.2"
	runtimeOnly "com.fasterxml.jackson.core:jackson-databind:2.18.2"
	runtimeOnly "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.18.2"
	runtimeOnly "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2"
	runtimeOnly "com.fasterxml.jackson.module:jackson-module-kotlin:2.18.2"
	runtimeOnly "com.fasterxml:classmate:1.7.0"
	runtimeOnly "com.github.victools:jsonschema-generator:4.38.0"
	runtimeOnly "com.github.victools:jsonschema-module-jackson:4.38.0"
	runtimeOnly "com.github.victools:jsonschema-module-swagger-2:4.38.0"
	runtimeOnly "com.squareup.okhttp3:okhttp:4.12.0"
	runtimeOnly "com.squareup.okio:okio-jvm:3.6.0"
	runtimeOnly "com.standardwebhooks:standardwebhooks:1.1.0"
	runtimeOnly "io.swagger.core.v3:swagger-annotations:2.2.31"
	runtimeOnly "org.apache.httpcomponents.client5:httpclient5:5.3.1"
	runtimeOnly "org.apache.httpcomponents.core5:httpcore5-h2:5.2.4"
	runtimeOnly "org.apache.httpcomponents.core5:httpcore5:5.2.4"
	runtimeOnly "org.jetbrains.kotlin:kotlin-reflect:1.8.10"
	runtimeOnly "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.10"
	runtimeOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10"
	runtimeOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10"
	runtimeOnly "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
	runtimeOnly "org.jetbrains:annotations:13.0"
	runtimeOnly "org.slf4j:slf4j-api:2.0.16"
}
