apply from: "$rootProject.projectDir/gradle/distributableGhidraModule.gradle"
apply from: "$rootProject.projectDir/gradle/javaProject.gradle"
apply from: "$rootProject.projectDir/gradle/jacocoProject.gradle"
apply from: "$rootProject.projectDir/gradle/javaTestProject.gradle"
apply from: "$rootProject.projectDir/gradle/processorProject.gradle"
apply plugin: 'eclipse'
eclipse.project.name = 'Processors TILE'

dependencies {
	api project(':Base')
	pcodeTestImplementation project(':Emulation')
}

tasks.named('sleighCompile') {
	// Combining two or three independently decoded slots expands beyond the default 2 GiB heap.
	jvmArgs = []
	maxHeapSize = '4g'
}

tasks.named('pcodeTest') {
	maxHeapSize = '4g'
}
