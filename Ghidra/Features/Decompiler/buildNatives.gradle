/*
 * Try to find libbfd*.so or a static libbfd.a for linking decomp_dbg
 */
def linkBFDUnix(String compilerCmd) {
	boolean isShared = project.hasProperty('sharedBfd')

	def libName = "bfd"
	if (isShared) {
		def versionProc = 'ld.bfd -v'.execute()
		def versionOut = versionProc.text
		def matcher = versionOut =~ /([0-9].*)/
		if (matcher.find()) {
			def sharedName = "bfd-${matcher.group(1)}"
			def checkProc = ["ld", "-shared", "-o", "/dev/null", "-l" + libName].execute()
			def checkErr = checkProc.err.text
			checkProc.waitFor()
			if (!checkErr.contains("cannot find")) {
				libName = sharedName
			}
		}
	}

	def linkPrefix = isShared ? "" : "-Wl,-Bstatic "
	def linkSuffix = isShared ? "" : " -Wl,-Bdynamic"

	def lFlags = linkPrefix + "-l" + libName + linkSuffix + " -Wl,--no-whole-archive -lz"

	File dummyFile = File.createTempFile("bfd_test", ".c")
	dummyFile.text = "int main() { return 0; }"

	def cmd = [compilerCmd, dummyFile.absolutePath, "-o", "/dev/null"]

	cmd.add("-Wl,-u,bfd_openr")
	cmd.addAll(lFlags.split(/\s+/))

	def process = new ProcessBuilder(cmd).redirectErrorStream(true).start()
	def output = process.inputStream.text
	process.waitFor()

	if (process.exitValue() != 0) {

		if (output.contains("xmalloc") || output.contains("concat") || output.contains("hexvalue")) {
			lFlags += (" " + linkPrefix + "-liberty" + linkSuffix)
		}

		if (output.contains("sframe_")) {
			lFlags += (" " + linkPrefix + "-lsframe" + linkSuffix)
		}

		if (output.contains("ZSTD_")) {
			lFlags += " -lzstd"
		}
	}
	dummyFile.delete()

	return lFlags
}

// Flags to optimize decompile and sleigh binaries
def getOptFlags(NativeBinarySpec b) {
	def optFlags = []
	if (project.hasProperty('debug')) {
		optFlags += "-g"
	}
	if (project.hasProperty('opt')) {
		optFlags += "-O2"
	}
	if (project.hasProperty('lto')) {
		optFlags += "-flto"
	}
	b.cppCompiler.args.addAll optFlags
	b.cCompiler.args.addAll optFlags
	b.linker.args.addAll optFlags
}

// Make it possible to use system zlib
def checkZlibSources = { c ->
	if (isCurrentWindows() || !project.hasProperty('sysZlib')) {
		c.source {
			srcDir "src/decompile/zlib"
			include "*.c"
		}
	}
}

def checkSleighFlags(NativeBinarySpec b) {
	if (b.toolChain in Gcc || b.toolChain in Clang) {
		getOptFlags(b)
		if (project.hasProperty('sysZlib')) {
			b.linker.args "-lz"
		}
	}
	if (isCurrentWindows() || !project.hasProperty('sysZlib')) {
		b.cppCompiler.define "LOCAL_ZLIB"
		b.cCompiler.define "NO_GZIP"
	}
}

/*
 * Define the "native build model" for building the decompiler executables.
 * Options:
 * -Pcli	Build unoptimized debug interfaces with debug information (not for Windows)
 * -Pdebug	Build with debug information (all systems)
 * -PdecompTest Build decomp_test_dbg
 * -Plto	Enable Link Time Optimization (not for debug interfaces (-Pcli), disable on Windows with -Pnolto)
 * -Popt	Build optimized with GCC / Clang (disable on Windows with -Pnoopt)
 * -PsysZlib	Build against system zlib (ignored for Windows)
 * -PsharedBfd	Link against a shared libbfd
 */
model {
	components {
		decompile(NativeExecutableSpec) {
			baseName "decompile"
			targetPlatforms.each { platform ->
				targetPlatform platform
			}
			sources {
				cpp {
					source {
						srcDir "src/decompile/cpp"
						include decompiler_common_files
						include decompiler_opt_files
					}
					exportedHeaders {
						srcDir "src/decompile/cpp"
					}
				}
			}
			binaries.all { b ->
				getOptFlags(b)
			}
		} // end decompile
		
		sleigh(NativeExecutableSpec) {
			targetPlatforms.each { platform ->
				targetPlatform platform
			}
			sources {
				cpp {
					source {
						srcDir "src/decompile/cpp"
						include core_files
						include sleigh_common_files
						include sleigh_files
					}
					exportedHeaders {
						srcDir "src/decompile/cpp"
					}
				}
				withType(CSourceSet).all { c ->
					checkZlibSources(c)
				}
			}
			binaries.all { b ->
				checkSleighFlags(b)
			}
		} // end sleigh

		if (project.hasProperty('cli')) {
			decomp_dbg(NativeExecutableSpec) {
				baseName "decomp_dbg"
				targetPlatforms_bfd.each { platform ->
					targetPlatform platform
				}
				sources {
					cpp {
						source {
							srcDir "src/decompile/cpp"
							include decompiler_common_files
							include decompiler_cli_files
							include sleigh_common_files
						}
						exportedHeaders {
							srcDir "src/decompile/cpp"
						}
					}
					withType(CSourceSet).all { c ->
						checkZlibSources(c)
					}
				}
				binaries.all { b ->
					if (b.toolChain in Gcc || b.toolChain in Clang) {
						b.cppCompiler.args "-g"
						b.linker.args linkBFDUnix((b.toolChain in Clang) ? "clang" : "gcc").split(" ")
					}
					else if (b.toolChain in VisualCpp) {
						b.cppCompiler.args "/Zi"
						b.cppCompiler.args "/FS"
						b.linker.args "/DEBUG"
					}
					b.cppCompiler.define "CPUI_DEBUG"
					b.cppCompiler.define "__TERMINAL__"
					if (isCurrentWindows() || !project.hasProperty('sysZlib')) {
						b.cppCompiler.define "LOCAL_ZLIB"
						b.cCompiler.define "NO_GZIP"
					}
				}
			} // end decomp_dbg

			sleigh_dbg(NativeExecutableSpec) {
				targetPlatforms_bfd.each { platform ->
					targetPlatform platform
				}
				sources {
					cpp {
						source {
							srcDir "src/decompile/cpp"
							include core_files
							include sleigh_common_files
							include sleigh_files
						}
						exportedHeaders {
							srcDir "src/decompile/cpp"
						}
					}
					withType(CSourceSet).all { c ->
						checkZlibSources(c)
					}
				}
				binaries.all { b ->
					if (b.toolChain in Gcc || b.toolChain in Clang) {
						b.cppCompiler.args "-g"
						if (project.hasProperty('sysZlib')) {
							b.linker.args "-lz"
						}
					}
					else if (b.toolChain in VisualCpp) {
						b.cppCompiler.args "/Zi"
						b.cppCompiler.args "/FS"
						b.linker.args "/DEBUG"
					}
					if (isCurrentWindows() || !project.hasProperty('sysZlib')) {
						b.cppCompiler.define "LOCAL_ZLIB"
						b.cCompiler.define "NO_GZIP"
					}
					b.cppCompiler.define "YYDEBUG"
				}
			} // end sleigh_dbg
		} // end cli

		if (project.hasProperty('decompTest')) {
			decomp_test_dbg(NativeExecutableSpec) {
				baseName "decomp_test_dbg"
				targetPlatforms_bfd.each { platform ->
					targetPlatform platform
				}
				sources {
					cpp {
						source {
							srcDir "src/decompile/cpp"
							include "test.cc"
							include decompiler_test_files
						}
						exportedHeaders {
							srcDir "src/decompile/cpp/include"
						}
					}
					unittests(CppSourceSet) {
						source {
							srcDir "src/decompile/unittests"
							include "*.cc"
						}
						exportedHeaders {
							srcDir "src/decompile/cpp"
						}
					}
					withType(CSourceSet).all { c ->
						checkZlibSources(c)
					}
				}
				binaries.all { b ->
					b.cppCompiler.define "__TERMINAL__"
					checkSleighFlags(b)
				}
			} // end decomp_test_dbg
		} // end decompTest
	} // end components

	binaries {
		all { b ->
			if (b.toolChain in Gcc || b.toolChain in Clang) {
				b.cppCompiler.args "-std=c++11"
				b.cppCompiler.args "-Wall"
				b.cppCompiler.args "-Wno-sign-compare"
				if (b.targetPlatform.operatingSystem.linux) {
					b.cppCompiler.define "LINUX"
					b.cppCompiler.define "_LINUX"
				}
			}
			else if (b.toolChain in VisualCpp) {
				b.cppCompiler.args "/W3"
				b.cCompiler.args "/W3"
				if (project.hasProperty('debug')) {
					b.cppCompiler.args "/Zi"
					b.cppCompiler.args "/FS"
					b.cCompiler.args "/Zi"
					b.cCompiler.args "/FS"
					b.linker.args "/DEBUG"
				}
				if (!project.hasProperty('noopt')) {
					b.cppCompiler.args "/EHsc"
					b.cppCompiler.args "/O2"
					b.cppCompiler.args "/Oy"	// Omit frame pointer
					b.cppCompiler.args "/GL"
					b.cCompiler.args "/EHsc"
					b.cCompiler.args "/O2"
					b.cCompiler.args "/Oy"		// Omit frame pointer
					b.cCompiler.args "/GL"
				}
				if (!project.hasProperty('nolto')) {
					b.linker.args "/LTCG"
				}
				b.cppCompiler.define "_SECURE_SCL=0"
				b.cppCompiler.define "_HAS_ITERATOR_DEBUGGING=0"
				b.cppCompiler.define "_HAS_STD_BYTE=0"  // msvc has a byte typedef that conflicts with c++17 std::byte
				if (b.targetPlatform.operatingSystem.windows) {
					b.cppCompiler.define "WINDOWS"
					b.cppCompiler.define "_WINDOWS"
					b.cppCompiler.define "WIN32"
					b.cppCompiler.define "_WIN32"
					if (b.targetPlatform.name == "win_x86_64") {
						b.cppCompiler.define "WIN64"
						b.cppCompiler.define "_WIN64"
					}	
				}
				b.cCompiler.define "_CRT_SECURE_NO_DEPRECATE"
				b.cCompiler.define "_CRT_NONSTDC_NO_DEPRECATE"
				b.cCompiler.define "ZLIB_WINAPI"
			}
		} // end all
	} // end binaries
} // end model
